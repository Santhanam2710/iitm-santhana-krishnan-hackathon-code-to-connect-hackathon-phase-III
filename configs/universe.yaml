# TRIDENT universe: 15 index members (Module A) + a credit watchlist (signals only).
# cap_weight: relative mock market-cap weight used for the benchmark (normalized at load).
# vol: annualized volatility prior, replaced by EWMA vol from prices when available.
# ambiguous: alias is a common English word; requires financial context to resolve.
index:
  - {ticker: AAPL,  name: "Apple Inc.",          sector: Technology,   cap_weight: 12.0, vol: 0.28, aliases: ["Apple", "iPhone", "Tim Cook", "Apple Inc"], ambiguous: ["Apple"]}
  - {ticker: MSFT,  name: "Microsoft",           sector: Technology,   cap_weight: 12.0, vol: 0.26, aliases: ["Microsoft", "Azure", "Satya Nadella"]}
  - {ticker: NVDA,  name: "NVIDIA",              sector: Technology,   cap_weight: 13.0, vol: 0.52, aliases: ["Nvidia", "NVIDIA", "Jensen Huang", "Blackwell"]}
  - {ticker: AMZN,  name: "Amazon",              sector: Consumer,     cap_weight: 8.0,  vol: 0.33, aliases: ["Amazon", "AWS", "Andy Jassy"]}
  - {ticker: GOOGL, name: "Alphabet",            sector: Communication, cap_weight: 8.0, vol: 0.30, aliases: ["Alphabet", "Google", "YouTube", "Sundar Pichai"]}
