  - {ticker: JPM,   name: "JPMorgan Chase",      sector: Banks,        cap_weight: 5.0,  vol: 0.24, aliases: ["JPMorgan", "JP Morgan", "J.P. Morgan", "JPMorgan Chase", "Jamie Dimon"]}
  - {ticker: BAC,   name: "Bank of America",     sector: Banks,        cap_weight: 3.0,  vol: 0.29, aliases: ["Bank of America", "BofA", "Brian Moynihan"]}
  - {ticker: XOM,   name: "Exxon Mobil",         sector: Energy,       cap_weight: 4.0,  vol: 0.27, aliases: ["Exxon", "ExxonMobil", "Exxon Mobil"]}
  - {ticker: JNJ,   name: "Johnson & Johnson",   sector: Healthcare,   cap_weight: 3.5,  vol: 0.17, aliases: ["Johnson & Johnson", "J&J"]}
  - {ticker: PFE,   name: "Pfizer",              sector: Healthcare,   cap_weight: 1.5,  vol: 0.25, aliases: ["Pfizer"]}
  - {ticker: TSLA,  name: "Tesla",               sector: Consumer,     cap_weight: 5.0,  vol: 0.60, aliases: ["Tesla", "Elon Musk"]}
  - {ticker: BA,    name: "Boeing",              sector: Industrials,  cap_weight: 1.5,  vol: 0.40, aliases: ["Boeing", "737 MAX"]}
