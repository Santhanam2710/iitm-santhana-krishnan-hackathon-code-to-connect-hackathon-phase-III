# Watchlist names produce signals and feed sector contagion, but carry no index weight.
watchlist:
  - {ticker: SIVB, name: "SVB Financial Group",  sector: Banks, aliases: ["SVB", "Silicon Valley Bank", "SVB Financial"]}
  - {ticker: SBNY, name: "Signature Bank",       sector: Banks, aliases: ["Signature Bank"]}
  - {ticker: FRC,  name: "First Republic Bank",  sector: Banks, aliases: ["First Republic", "First Republic Bank"]}
  - {ticker: SCHW, name: "Charles Schwab",       sector: Banks, aliases: ["Charles Schwab", "Schwab"]}
  - {ticker: WAL,  name: "Western Alliance",     sector: Banks, aliases: ["Western Alliance"]}
  - {ticker: PACW, name: "PacWest Bancorp",      sector: Banks, aliases: ["PacWest"]}
