  - {ticker: UBS,  name: "UBS Group",            sector: Banks, aliases: ["UBS"]}

# Sector correlation used for contagion (Module A spillover, Module B second-order PD shocks).
sector_links:
  Banks:        {Banks: 1.0, Industrials: 0.35, Consumer: 0.25, Technology: 0.2, Energy: 0.2, Healthcare: 0.1, Communication: 0.15}
  Technology:   {Technology: 1.0, Communication: 0.6, Consumer: 0.4}
  Energy:       {Energy: 1.0, Industrials: 0.4}
  Industrials:  {Industrials: 1.0, Energy: 0.3, Consumer: 0.3}
  Consumer:     {Consumer: 1.0, Technology: 0.3}
  Healthcare:   {Healthcare: 1.0}
  Communication: {Communication: 1.0, Technology: 0.6}
