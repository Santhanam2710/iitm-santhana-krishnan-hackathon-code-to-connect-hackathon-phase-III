[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-risk-engine"
version = "1.0.0"
description = "Real-time AI/NLP risk engine with a tactical index rebalancer and a wholesale-banking stress tester"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
trident = "trident.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trident = ["dashboard/static/*", "dashboard/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
